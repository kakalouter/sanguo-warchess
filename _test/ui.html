<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>真实入口页测试</title>
<style>#log{position:fixed;right:0;top:0;width:440px;bottom:0;z-index:99999;background:rgba(8,6,4,.94);color:#c8d8e8;
font:11.5px/1.6 Consolas,"Microsoft YaHei",monospace;padding:12px;overflow:auto;white-space:pre-wrap;border-left:1px solid #443}
#log b{color:#e8c86a}.ok{color:#7ad0a8}.err{color:#ff7a5a}.warn{color:#e8c05a}</style>
</head>
<body>
<iframe id="fr" src="/index.html" style="position:fixed;left:0;top:0;width:calc(100% - 440px);height:100%;border:0"></iframe><div id="log"></div>
<script>
window.__DIAG={sent:false};
const L=[];const out=document.getElementById('log');
const say=(s,c)=>{L.push(c?'<span class="'+c+'">'+s+'</span>':s);out.innerHTML=L.join('\n');window.__PARTIAL=L.join('\n');};
const ok=s=>say('  <span class="ok">✔</span> '+s), bad=s=>say('  <span class="err">✘ '+s+'</span>'), warn=s=>say('  <span class="warn">! '+s+'</span>');
const head=s=>say('\n<b>▍'+s+'</b>');
setTimeout(()=>{ if(!window.__DIAG||!window.__DIAG.sent) fetch('/result',{method:'POST',body:(window.__PARTIAL||'(空)')+'\n\nWATCHDOG'}); },110000);

const fr=document.getElementById('fr');
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
function shot(cv,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(cv,0,0,w,h);return c;}
async function post(cv,w,h,label){ const c=shot(cv,w,h); await fetch('/shot',{method:'POST',body:c.toDataURL('image/png')}); say('    · 截图 '+label); }

(async()=>{
 try{
  await new Promise(r=>{ fr.onload=r; });
  say('iframe /index.html 已加载');
  const W=fr.contentWindow, D=fr.contentDocument;

  // 收集 iframe 内错误
  const errs=[];
  W.addEventListener('error',e=>errs.push('err: '+e.message));
  W.addEventListener('unhandledrejection',e=>errs.push('rej: '+(e.reason&&(e.reason.message||e.reason))));

  head('1 · 开场选择势力界面');
  await wait(3500);
  const boot=D.getElementById('boot');
  say('  #boot class = "'+boot.className+'"  文本长度 '+boot.textContent.length);
  const cards=D.querySelectorAll('#startCards .card');
  ok(`势力选择卡片 ${cards.length} 张: ${[...cards].slice(0,6).map(c=>c.querySelector('.card-t').textContent).join('、')}…`);
  const bootSeal=D.querySelector('.boot-seal');
  say('  印章元素 '+(bootSeal?'存在':'缺失')+'  标题 "'+(D.querySelector('.boot-box h1')||{}).textContent+'"');

  head('2 · 点击"曹操"开局');
  const caocao=[...cards].find(c=>c.dataset.fid==='caocao');
  if(!caocao){ bad('找不到曹操卡片'); throw new Error('no caocao card'); }
  caocao.click();
  await wait(5000);
  const app=D.getElementById('app');
  say('  #app class = "'+app.className+'"');
  !app.classList.contains('hidden') ? ok('主界面已显示') : bad('主界面仍隐藏');
  const cv=D.getElementById('mapCanvas');
  say('  mapCanvas 尺寸 attr='+cv.width+'x'+cv.height+' css='+cv.clientWidth+'x'+cv.clientHeight);

  head('3 · 顶栏数据');
  const g=(id)=>(D.getElementById(id)||{}).textContent;
  say(`  势力="${g('factionBadge').replace(/\s+/g,'')}"  日期="${g('dateBox')}"`);
  say(`  金=${g('resGold')}  粮=${g('resFood')}  兵=${g('resTroops')}  城=${g('resCities')}  将=${g('resGenerals')}`);
  (g('resCities')==='3') ? ok('曹操初始 3 城，符合剧本') : warn('城数='+g('resCities')+'（预期 3）');

  head('4 · 势力列表');
  const pr=D.querySelectorAll('#powerList .power-row');
  ok(`势力列表 ${pr.length} 行`);
  say('  前 5 行: '+[...pr].slice(0,5).map(r=>r.textContent.replace(/\s+/g,' ').trim()).join(' | '));

  head('5 · 地图渲染');
  await wait(2500);
  const st=(()=>{const c=shot(cv,400,300);const d=c.getContext('2d').getImageData(0,0,400,300).data;
    let nb=0,sum=0;const set=new Set();for(let i=0;i<d.length;i+=4){const v=d[i]+d[i+1]+d[i+2];sum+=v;if(v>30)nb++;set.add((d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4));}
    return {ratio:nb/(400*300),bright:sum/(400*300*3),colors:set.size,url:c.toDataURL('image/png')};})();
  say(`  非黑=${(st.ratio*100).toFixed(1)}%  亮度=${st.bright.toFixed(1)}  色彩簇=${st.colors}`);
  st.ratio>0.6 ? ok('战略地图渲染正常') : bad('地图渲染异常');
  await fetch('/shot',{method:'POST',body:st.url}); say('    · 截图 开局地图');

  head('6 · 点击城池打开面板');
  // 用 MapView 的 API 直接选中城池（等价于点击）
  W.MapView.focusOn(114.5,34.7,20);
  await wait(1500);
  // 触发 pick：直接调用 MainUI 内部不可见，改为点 canvas 中心
  const rect=cv.getBoundingClientRect();
  const ev=(type,x,y)=>cv.dispatchEvent(new W.MouseEvent(type,{clientX:x,clientY:y,bubbles:true,button:0}));
  // 用 pointer 事件序列模拟点击
  const px=rect.left+rect.width*0.5, py=rect.top+rect.height*0.55;
  cv.dispatchEvent(new W.PointerEvent('pointerdown',{clientX:px,clientY:py,bubbles:true,button:0,pointerId:1}));
  cv.dispatchEvent(new W.PointerEvent('pointerup',{clientX:px,clientY:py,bubbles:true,button:0,pointerId:1}));
  await wait(2200);
  const cn=g('cityName');
  say('  城池面板 #cityName = "'+cn+'"');
  if(cn && cn!=='—'){
    ok('点击城池成功打开面板');
    say('  归属: "'+g('cityOwner').replace(/\s+/g,' ').trim()+'"');
    const stats=D.querySelectorAll('#cityStats .stat');
    ok(`城池属性行 ${stats.length} 项`);
    const chips=D.querySelectorAll('#cityGenerals .gen-chip');
    say(`  武将格 ${chips.length} 个`);
    const acts=D.querySelectorAll('#cityActions .btn');
    ok(`内政/军事按钮 ${acts.length} 个: ${[...acts].map(b=>b.textContent).join(' ')}`);
    // 检查头像是否真的画上了（非空白）
    if(chips.length){
      const cc=chips[0].querySelector('canvas');
      const dd=cc.getContext('2d').getImageData(0,0,cc.width,cc.height).data;
      let nz=0;for(let i=0;i<dd.length;i+=4)if(dd[i]+dd[i+1]+dd[i+2]>40)nz++;
      const pct=nz/(cc.width*cc.height)*100;
      pct>60?ok(`武将头像已绘制（非空 ${pct.toFixed(0)}%，尺寸 ${cc.width}×${cc.height}）`):warn(`头像偏空 ${pct.toFixed(0)}%`);
      say('  武将: '+[...chips].map(c=>c.textContent.trim()).join(' '));
    }
    await post(cv,400,300,'城池面板');
  } else bad('未能打开城池面板');

  head('7 · 弹窗：武将 / 势力 / 战报 / 帮助 / 存档');
  for(const [id,label] of [['btnRoster','武将名册'],['btnPowers','势力'],['btnLog','战报'],['btnHelp','帮助'],['btnSave','存档']]){
    D.getElementById(id).click();
    await wait(700);
    const mb=D.getElementById('modal'), mtitle=D.getElementById('modalTitle').textContent;
    const mbody=D.getElementById('modalBody');
    const vis=!mb.classList.contains('hidden');
    const cards=mbody.querySelectorAll('.card').length, rows=mbody.querySelectorAll('.kv').length;
    vis?ok(`${label} 弹窗打开（标题"${mtitle}"，卡片 ${cards}，条目 ${rows}，正文 ${mbody.textContent.length} 字）`):bad(`${label} 弹窗未打开`);
    if(vis) await post(cv,10,10,label+'（忽略）').catch(()=>{});
    D.getElementById('modalClose').click();
    await wait(300);
  }

  head('8 · 结束回合（含 AI）');
  const before=g('dateBox');
  D.getElementById('btnEndTurn').click();
  await wait(6000);
  const after=g('dateBox');
  say(`  日期 "${before}" -> "${after}"`);
  before!==after?ok('回合推进成功'):bad('回合未推进');
  say('  资源: 金='+g('resGold')+' 粮='+g('resFood')+' 兵='+g('resTroops'));
  const toasts=D.querySelectorAll('#toastLayer .toast');
  say(`  提示条 ${toasts.length} 条: ${[...toasts].slice(0,3).map(t=>t.textContent).join(' | ')}`);

  head('9 · 存档导出');
  // 直接测 SaveSys
  const ser=W.SaveSys.serialize();
  ok(`序列化成功 ${(JSON.stringify(ser).length/1024).toFixed(0)} KB  势力=${ser.meta.playerName} ${ser.meta.year}年${ser.meta.month}月`);
  const lr=W.SaveSys.saveLocal(3);
  const lret=W.SaveSys.loadLocal(3);
  lret.ok?ok('浏览器存档往返成功'):bad('浏览器存档失败: '+lr.msg);
  say('  SaveSys.download 存在: '+(typeof W.SaveSys.download==='function'));

  head('10 · 战斗场景');
  // 直接在 iframe 内构造一场战斗
  try{
    const S=W.GameCore.S;
    const cap=W.GameCore.factionCities('caocao')[0];
    const tgt=Object.values(S.cities).find(c=>c.owner!=='caocao'&&c.owner!=='neutral');
    const gs=W.GameCore.generalsIn(cap.id).filter(x=>!x.army).slice(0,3);
    const fa=W.GameCore.formArmy('caocao',cap.id,gs.map(x=>x.id),Math.floor(cap.troops*0.7),tgt.id);
    say('  出兵: '+(fa.ok?W.GameCore.armyName(fa.army)+' -> '+tgt.name:fa.msg));
    if(fa.ok){
      W.GameCore.marchArmy(fa.army,tgt.id);
      // 强制推进到城下
      for(let i=0;i<12 && fa.army.state==='moving';i++) W.GameCore.stepArmy(fa.army);
      say('  部队状态: '+fa.army.state+' 位置 '+S.cities[fa.army.at].name);
      // 触发真实战斗入口
      const bc=D.getElementById('battleCanvas');
      say('  战斗画布当前 class="'+bc.className+'"');
      // 直接调用内部 startBattle 不可见，改用结束回合触发
      D.getElementById('btnEndTurn').click();
      await wait(7000);
      const bu=D.getElementById('battleUI');
      const inBattle=!bu.classList.contains('hidden');
      if(inBattle){
        ok('已进入战斗界面');
        say('  '+g('btAtkName')+' vs '+g('btDefName')+'  '+g('btTurn')+' / '+g('btSideNow')+'  天候 '+g('btWeather'));
        await wait(2500);
        const bst=(()=>{const c=shot(bc,400,300);const d=c.getContext('2d').getImageData(0,0,400,300).data;
          let nb=0,sum=0;for(let i=0;i<d.length;i+=4){const v=d[i]+d[i+1]+d[i+2];sum+=v;if(v>30)nb++;}
          return {ratio:nb/(400*300),bright:sum/(400*300*3),url:c.toDataURL('image/png')};})();
        say(`  战场 非黑=${(bst.ratio*100).toFixed(1)}% 亮度=${bst.bright.toFixed(1)}`);
        bst.ratio>0.5?ok('战场渲染正常'):bad('战场渲染异常');
        await fetch('/shot',{method:'POST',body:bst.url}); say('    · 截图 战场');
        const lg=D.querySelectorAll('#battleLog div');
        ok(`战斗日志 ${lg.length} 条: ${[...lg].slice(0,2).map(x=>x.textContent).join(' | ')}`);
        // 结束本方
        const es=D.getElementById('btEndSide');
        if(!es.disabled){ es.click(); await wait(5000); say('  结束本方行动后: '+g('btTurn')+' / '+g('btSideNow')); }
        const es2=D.getElementById('btEndSide');
        if(!es2.disabled){ es2.click(); await wait(5000); say('  再次结束: '+g('btTurn')+' / '+g('btSideNow')); }
        // 自动战斗
        D.getElementById('btAuto').click();
        await wait(12000);
        const res=D.getElementById('battleResult');
        if(!res.classList.contains('hidden')){
          ok('战斗已分出胜负');
          say('  结果: '+res.textContent.replace(/\s+/g,' ').trim().slice(0,120));
          await post(bc,400,300,'战斗结算');
          D.getElementById('brBack').click();
          await wait(3000);
          const back=!D.getElementById('app').classList.contains('hidden');
          back?ok('已返回大地图'):bad('未能返回大地图');
          say('  返回后资源: 城='+g('resCities')+' 兵='+g('resTroops'));
        } else { warn('战斗尚未结束（12s 内）'); }
      } else warn('未进入战斗界面（部队可能未抵达或状态非 sieging）');
    }
  }catch(e){ bad('战斗测试异常: '+e.message); say(String(e.stack||'').slice(0,400)); }

  head('汇总');
  errs.length?errs.forEach(e=>bad(e)):ok('iframe 内无 JS 错误');
  say('\n完成');
 }catch(e){
  bad('测试脚本异常: '+e.message); say(String(e.stack||'').slice(0,600));
 }
 window.__DIAG.sent=true;
 await fetch('/result',{method:'POST',body:L.join('\n')});
 document.title='DONE';
})();
</script></body></html>
